<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyline Weather</title>
<meta name="description" content="Live weather, hourly and 7-day forecast, air quality. English and Arabic.">
<meta name="theme-color" content="#1f6fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skyline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one column station readout — search + saved places, animated sky hero, hourly trace, 7-day range bars, details grid */
:root {
  --bg: #eef3f8;
  --panel: #ffffff;
  --panel-2: #f6f9fc;
  --fg: #142233;
  --muted: #5a6b7d;
  --line: #d5dfea;
  --accent: #1f6fd1;
  --warm: #e0802b;
  --cool: #3a9bd9;
  --shadow: 0 1px 2px rgb(20 40 70 / .06), 0 8px 24px rgb(20 40 70 / .08);
  --good: #2e9e5b; --fair: #d6a21e; --poor: #e0702b; --bad: #c8414b; --vbad: #8e3fa8;
  --amb: #5aa9f0;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b121c; --panel: #131e2c; --panel-2: #172435; --fg: #e4ecf5; --muted: #93a4b8;
    --line: #243347; --accent: #6aa8f0; --warm: #f0a25c; --cool: #6cc0f0;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b121c; --panel: #131e2c; --panel-2: #172435; --fg: #e4ecf5; --muted: #93a4b8;
  --line: #243347; --accent: #6aa8f0; --warm: #f0a25c; --cool: #6cc0f0;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .3);
  color-scheme: dark;
}
:root:lang(ar) {
  --font-display: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.55 var(--font-body);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  transition: background-color .4s;
}
.ambient {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 55% at 50% -10%, color-mix(in srgb, var(--amb) 40%, transparent), transparent 70%);
  transition: opacity .8s;
}
.wrap, .stack { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.wrap > *, .stack > * { min-width: 0; }

/* ---------- header & controls ---------- */
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 1.3rem var(--font-display); letter-spacing: -0.01em; }
.brand svg { width: 32px; height: 32px; }
.brand .sun { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) { .brand .sun { animation: spin 18s linear infinite; } }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, input {
  font: inherit; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-height: 40px;
}
button { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform .15s, border-color .15s, background-color .15s; }
button:hover { border-color: var(--accent); }
button:active { transform: scale(.95); }
button:focus-visible, input:focus-visible, li:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button svg { width: 18px; height: 18px; }
.icon-btn { width: 40px; padding: 0; justify-content: center; }
.seg { position: relative; display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.seg button { position: relative; z-index: 1; border: 0; border-radius: 0; min-width: 44px; justify-content: center; background: transparent; transition: color .25s; }
.seg button[aria-pressed="true"] { color: #fff; }
.seg .thumb { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 10px; transition: inset-inline-start .3s cubic-bezier(.3,1.4,.5,1), width .3s; }
.seg-lang button:last-of-type { font-family: "Cairo", system-ui, sans-serif; font-weight: 700; }
.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- search ---------- */
.search { position: relative; }
.search input { width: 100%; padding-block: 13px; padding-inline: 44px 14px; font-size: 1rem; box-shadow: var(--shadow); border-radius: 14px; transition: box-shadow .2s, border-color .2s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); outline: none; }
.search > svg { position: absolute; inset-inline-start: 15px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search kbd { position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%); font: 600 .75rem var(--font-data); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; pointer-events: none; }
.search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
.suggest {
  position: absolute; z-index: 15; left: 0; right: 0; top: calc(100% + 6px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  list-style: none; margin: 0; padding: 6px; box-shadow: 0 16px 40px rgb(0 0 0 / 0.2);
  animation: pop .18s ease-out;
}
.suggest li { padding: 10px 12px; border-radius: 9px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
.suggest li:hover, .suggest li[aria-selected="true"] { background: var(--panel-2); }
.suggest small { color: var(--muted); }
.suggest .flag { font-size: 1.1rem; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none; }
.chips:empty { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 4px; padding-block: 4px; padding-inline: 12px 4px;
  border-radius: 999px; background: var(--panel); border: 1px solid var(--line); min-height: 36px; font-size: .92rem;
  animation: pop .25s ease-out both;
}
.chip.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); }
.chip .go { all: unset; cursor: pointer; }
.chip .go:focus-visible { outline: 2px solid var(--accent); border-radius: 4px; }
.chip .x { all: unset; cursor: pointer; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.chip .x:hover { background: var(--panel-2); color: var(--bad); }

/* ---------- sky hero (its own painted world, same in both themes) ---------- */
.now {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: 24px; padding: 26px; color: #fff;
  display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  background: linear-gradient(160deg, #3d8fe0, #7cbcf0);
  box-shadow: 0 18px 40px -12px rgb(20 50 90 / .45);
  text-shadow: 0 1px 12px rgb(0 0 0 / .18);
  transition: background .8s;
}
.now > div { min-width: 0; }
.now canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.now::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(0deg, rgb(0 0 0 / .18), transparent 45%); }
.sky-clear-day   { background: linear-gradient(165deg, #2a78d4 0%, #58a6ee 55%, #9fd2f9 100%); }
.sky-clear-night { background: linear-gradient(165deg, #070f26 0%, #162450 55%, #2e3f78 100%); }
.sky-cloud-day   { background: linear-gradient(165deg, #56789a 0%, #86a2be 100%); }
.sky-cloud-night { background: linear-gradient(165deg, #151d29 0%, #33435a 100%); }
.sky-rain        { background: linear-gradient(165deg, #2c3e52 0%, #557089 100%); }
.sky-storm       { background: linear-gradient(165deg, #14121f 0%, #3b3557 100%); }
.sky-snow        { background: linear-gradient(165deg, #6f8bab 0%, #b9cde3 100%); }
.sky-fog         { background: linear-gradient(165deg, #6b7885 0%, #a4afba 100%); }

.place-row { display: flex; align-items: center; gap: 6px; }
.place { font: 800 1.7rem/1.2 var(--font-display); margin: 0; text-wrap: balance; min-width: 0; overflow-wrap: anywhere; }
.star { all: unset; cursor: pointer; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; flex: none; transition: transform .2s, background .2s; }
.star:hover { background: rgb(255 255 255 / .15); }
.star:active { transform: scale(.85); }
.star:focus-visible { outline: 2px solid #fff; }
.star svg { width: 22px; height: 22px; }
.star.burst svg { animation: burst .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes burst { 0% { transform: scale(.4) rotate(-30deg); } 100% { transform: none; } }
.sub { opacity: .9; margin: 2px 0 0; font-size: .95rem; }
.temp { font: 800 clamp(4.4rem, 17vw, 7.5rem)/1 var(--font-display); letter-spacing: -0.04em; margin: 14px 0 0; font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.cond { font-size: 1.18rem; margin: 6px 0 0; font-weight: 600; }
.summary { margin: 6px 0 0; opacity: .92; max-width: 48ch; }
.now svg.big { width: clamp(110px, 24vw, 170px); height: auto; filter: drop-shadow(0 10px 18px rgb(0 0 0 / .25)); }
.alert {
  grid-column: 1 / -1; display: flex; gap: 10px; align-items: center;
  background: rgb(0 0 0 / .26); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgb(255 255 255 / .18); border-radius: 14px; padding: 10px 14px; font-size: .95rem;
}
.alert svg { width: 20px; height: 20px; flex: none; color: #ffd25a; }
@media (prefers-reduced-motion: no-preference) { .alert svg { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { transform: scale(1.18); opacity: .7; } }

/* animated weather icons */
.ic-rays, .ic-cloud, .ic-drop, .ic-flake, .ic-bolt, .ic-fog, .ic-moon { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .anim .ic-rays { animation: spin 14s linear infinite; }
  .anim .ic-cloud { animation: bob 4s ease-in-out infinite; }
  .anim .ic-drop { animation: fall 1.1s linear infinite; }
  .anim .ic-flake { animation: flake 2.4s linear infinite; }
  .anim .ic-bolt { animation: zap 2.2s steps(1) infinite; }
  .anim .ic-fog { animation: drift 3.5s ease-in-out infinite alternate; }
  .anim .ic-moon { animation: glow 3s ease-in-out infinite; }
  .now .big { animation: float 6s ease-in-out infinite; }
}
@keyframes bob { 50% { transform: translateY(-2px); } }
@keyframes fall { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(6px); opacity: 0; } }
@keyframes flake { 0% { transform: translateY(-4px) rotate(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(7px) rotate(90deg); opacity: 0; } }
@keyframes zap { 0%, 60% { opacity: 1; } 62% { opacity: .2; } 66% { opacity: 1; } 70% { opacity: .3; } 74%, 100% { opacity: 1; } }
@keyframes drift { to { transform: translateX(5px); } }
@keyframes glow { 50% { filter: drop-shadow(0 0 6px #fff6c8); } }
@keyframes float { 50% { transform: translateY(-8px); } }

/* ---------- cards ---------- */
section h2 { font: 800 1.08rem var(--font-display); margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.card-head small { color: var(--muted); }
.card-head small b { color: var(--cool); font-weight: 600; }
.hourly { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: thin; cursor: grab; user-select: none; }
.hourly.dragging { cursor: grabbing; }
.hourly svg { display: block; min-width: 780px; width: 100%; height: auto; }
.hourly text { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
.hourly text.t { fill: var(--fg); font-weight: 600; font-size: 12px; }
.hourly text.p { fill: var(--cool); font-size: 10px; }
.hourly .now-line { stroke: var(--accent); stroke-dasharray: 3 4; opacity: .5; }

.days { list-style: none; margin: 0; padding: 0; display: grid; }
.days li {
  display: grid; grid-template-columns: 5.8rem 34px minmax(0, 1fr) 3rem minmax(80px, 2fr) 3rem;
  gap: 10px; align-items: center; padding: 10px 8px; margin-inline: -8px;
  border-top: 1px solid var(--line); border-radius: 12px;
  font-variant-numeric: tabular-nums; cursor: pointer; transition: background-color .2s, transform .2s;
}
.days li:first-child { border-top-color: transparent; }
.days li:hover { background: var(--panel-2); }
.days li[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 9%, var(--panel)); box-shadow: inset 3px 0 0 var(--accent); }
[dir="rtl"] .days li[aria-selected="true"] { box-shadow: inset -3px 0 0 var(--accent); }
.days .d { font-weight: 700; }
.days .c { color: var(--muted); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.days .lo, .days .hi { font-family: var(--font-data); text-align: end; direction: ltr; }
.days .lo { color: var(--muted); }
.days .hi { text-align: start; }
.bar { position: relative; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar span { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, var(--cool), var(--warm)); transform-origin: left center; }
[dir="rtl"] .bar span { background: linear-gradient(270deg, var(--cool), var(--warm)); transform-origin: right center; }
.days svg { width: 32px; height: 32px; }
.rain { color: var(--cool); font-size: 0.8rem; font-family: var(--font-data); }

.details { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tile {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px;
  display: grid; gap: 4px; align-content: start; min-width: 0; box-shadow: var(--shadow);
  transition: transform .25s, box-shadow .25s, border-color .25s;
}
.tile:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.tile.wide { grid-column: span 2; }
.tile .k { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
:lang(ar) .tile .k { letter-spacing: 0; font-size: .85rem; }
.tile .k svg { width: 15px; height: 15px; flex: none; }
.tile .v { font: 600 1.5rem/1.25 var(--font-data); font-variant-numeric: tabular-nums; }
.tile .v small { font: 400 .88rem var(--font-body); color: var(--muted); }
.tile .n { font-size: .86rem; color: var(--muted); }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font: 700 .75rem var(--font-body); color: #fff; vertical-align: middle; }
.meter { height: 6px; border-radius: 3px; position: relative; margin-top: 6px; direction: ltr; }
.meter i { position: absolute; top: -4px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 3px solid var(--fg); transform: translateX(-50%); }
.meter.uv { background: linear-gradient(90deg, #3ca55c, #e8c22c, #ec8b24, #d8413a, #8e3fa8); }
.meter.aq { background: linear-gradient(90deg, #3ca55c 0 10%, #e8c22c 10% 20%, #ec8b24 20% 30%, #d8413a 30% 40%, #8e3fa8 40% 60%, #6b2335 60%); }
.meter.hum { background: linear-gradient(90deg, #e7c48a, #8fd0b4, #3a9bd9); }
.compass { width: 70px; height: 70px; }
.sunarc, .moonsvg { direction: ltr; }
.sunarc { width: 100%; height: auto; max-width: 300px; }
.sunarc text { font: 11px var(--font-data); fill: var(--muted); }
.moonsvg { width: 58px; height: 58px; }
.row { display: flex; align-items: center; gap: 14px; }

.msg { color: var(--muted); text-align: center; padding: 24px; }
.msg.err { color: var(--bad); }
.skel { border-radius: 24px; background: linear-gradient(90deg, var(--panel), var(--line), var(--panel)); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
@keyframes shimmer { to { background-position: -200% 0; } }
footer { color: var(--muted); font-size: 0.82rem; text-align: center; }
footer a { color: inherit; }
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: .92rem; z-index: 30;
  max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgb(0 0 0 / .25); animation: toastIn .3s cubic-bezier(.3,1.4,.5,1);
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 14px); } }

/* entrance + data animations (resting state is fully visible) */
@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: rise .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  .enter .tile { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(300ms + var(--i, 0) * 50ms); }
  .enter .days li { animation: slide .45s ease-out both; animation-delay: calc(200ms + var(--i, 0) * 45ms); }
  .enter .bar span { animation: grow .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(350ms + var(--i, 0) * 45ms); }
  .meter i { animation: slideIn 1s cubic-bezier(.2,.8,.2,1) both .3s; }
  .draw-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s cubic-bezier(.4,0,.2,1) forwards; }
  .draw-area { animation: fadeIn 1s ease-out both .4s; }
  .grow-bar { transform-box: fill-box; transform-origin: bottom; animation: growY .6s cubic-bezier(.2,.8,.2,1) both; }
  .fade-in { animation: fadeIn .5s ease-out both; }
  .sun-dot { animation: fadeIn .8s ease-out both .6s; }
  .needle { transition: transform 1s cubic-bezier(.3,1.5,.5,1); }
  .lang-swap { animation: langSwap .35s ease-out; }
}
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } }
@keyframes slide { from { opacity: 0; transform: translateX(-12px); } }
[dir="rtl"] .enter .days li { animation-name: slideR; }
@keyframes slideR { from { opacity: 0; transform: translateX(12px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes slideIn { from { left: 0; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes langSwap { from { opacity: .3; filter: blur(3px); } }

/* ---------- extra motion ---------- */
.blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.blobs i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); }
.blobs i:nth-child(1) { top: -18vmax; left: -12vmax; background: var(--amb); opacity: .28; }
.blobs i:nth-child(2) { top: 35vh; right: -18vmax; background: var(--accent); opacity: .12; }
.blobs i:nth-child(3) { bottom: -22vmax; left: 15vw; background: var(--warm); opacity: .10; }
button, .star, .chip .go, .chip .x { position: relative; overflow: hidden; }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .25; transform: scale(0); animation: ripple .6s ease-out forwards; }
@keyframes ripple { to { transform: scale(4); opacity: 0; } }
.now { transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .5s cubic-bezier(.2,.8,.2,1), background .8s, filter .4s; will-change: transform; }
.now.tilting { transition: transform .08s linear, background .8s; }
.now::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%), rgb(255 255 255 / .18), transparent 60%); }
.now.tilting::before { opacity: 1; }
.now > div, .now .alert { position: relative; z-index: 1; }
.now .big { position: relative; z-index: 1; translate: var(--px, 0) var(--py, 0); transition: translate .3s ease-out; }
.now.shake { animation: shake .4s; }
@keyframes shake { 20% { translate: -3px 1px; } 40% { translate: 3px -1px; } 60% { translate: -2px 0; } 80% { translate: 2px 1px; } }
.loading .now { filter: blur(2px) saturate(.8); }
.temp { background: linear-gradient(100deg, #fff 30%, #dbeeff 45%, #fff 60%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 2px 10px rgb(0 0 0 / .2)); }

<script>

/* ================= units & formatting ================= */
const toU = (c) => unit === "f" ? c * 9 / 5 + 32 : c;

const Sky = {

/* ================= data ================= */
async function load() {
  document.body.classList.add("loading");
  $("#refresh").classList.add("spin");
  const q = { latitude: place.lat, longitude: place.lon, timezone: "auto" };
  const url = "https://api.open-meteo.com/v1/forecast?" + new URLSearchParams({
    ...q, forecast_days: 7,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,is_day,precipitation,cloud_cover,visibility,dew_point_2m",
    hourly: "temperature_2m,weather_code,precipitation_probability,is_day",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset,uv_index_max"
  });
  const aurl = "https://air-quality-api.open-meteo.com/v1/air-quality?" + new URLSearchParams({ ...q, current: "us_aqi,pm2_5" });
  try {
    const [r, a] = await Promise.all([fetch(url), fetch(aurl).catch(() => null)]);
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
    air = a && a.ok ? (await a.json()).current : null;
    fetchedAt = Date.now();
    selDay = 0;
    render(true);
  } catch (e) {
    $("#content").innerHTML = `<p class="msg err">${S().offline}</p>`;
  } finally {
    document.body.classList.remove("loading");
    $("#refresh").classList.remove("spin");
  }
}

function skyName(kind, day) {
  if (kind === "sun") return day ? "clear-day" : "clear-night";
  if (kind === "partly" || kind === "cloud") return day ? "cloud-day" : "cloud-night";
  return kind;
}
const AMB = { "clear-day": "#5aa9f0", "clear-night": "#33478a", "cloud-day": "#8aa5bf", "cloud-night": "#3a4a5e", rain: "#5b7590", storm: "#5a4f80", snow: "#b9cde3", fog: "#a8b3bd" };

function hourIndex() {
  const now = data.current.time.slice(0, 13);
  return Math.max(0, data.hourly.time.findIndex(t => t.slice(0, 13) >= now));
}
function localNow() {
  return new Date(Date.now() + data.utc_offset_seconds * 1000).toLocaleTimeString(loc(), { timeZone: "UTC", hour: "numeric", minute: "2-digit" });
}
function outlook() {
  const d = data.daily, h = data.hourly, s = S();
  const start = hourIndex(), next = h.precipitation_probability.slice(start, start + 12);
  const peak = Math.max(0, ...next.map(v => v ?? 0)), parts = [];
  if (peak >= 50) {
    const at = next.findIndex(v => v >= 50);
    parts.push(at === 0 ? s.rainNow : s.rainAt(fmt(h.time[start + at], { hour: "numeric" })));
  } else parts.push(peak >= 25 ? s.showers : s.dry);
  const diff = d.temperature_2m_max[1] - d.temperature_2m_max[0];
  if (Math.abs(diff) >= 3) {
    const n = Math.round(Math.abs(unit === "f" ? diff * 1.8 : diff));
    parts.push(diff > 0 ? s.warmer(n) : s.cooler(n));
  }
  return parts.join(s.join) + ".";
}
function alertText() {
  const c = data.current, d = data.daily, s = S();
  if ([95, 96, 99].includes(c.weather_code)) return s.aStorm;
  if (c.wind_gusts_10m >= 70) return s.aGust(Wnd(c.wind_gusts_10m));
  if (d.uv_index_max[0] >= 8) return s.aUV(d.uv_index_max[0].toFixed(0));
  if (c.apparent_temperature >= 38) return s.aHeat;
  if (c.apparent_temperature <= -15) return s.aCold;
  return "";
}
function moonPhase(date = new Date()) {
  const f = (((date.getTime() / 86400000 - 10962.76) / 29.530588853) % 1 + 1) % 1; // since new moon 2000-01-06 18:14 UTC
  return { f, lit: Math.round((1 - Math.cos(2 * Math.PI * f)) / 2 * 100), idx: Math.floor(f * 8 + .5) % 8 };
}
function moonSvg(f) {
  const r = 24, cx = 29, cy = 29, rx = Math.abs(Math.cos(2 * Math.PI * f)) * r;
  let d;
  if (f < .5) d = `M${cx} ${cy - r}A${r} ${r} 0 0 1 ${cx} ${cy + r}A${rx} ${r} 0 0 ${f < .25 ? 0 : 1} ${cx} ${cy - r}z`;
  else d = `M${cx} ${cy - r}A${r} ${r} 0 0 0 ${cx} ${cy + r}A${rx} ${r} 0 0 ${f < .75 ? 0 : 1} ${cx} ${cy - r}z`;
  return `<svg class="moonsvg anim" viewBox="0 0 58 58" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--line)"/><path class="ic-moon" d="${d}" fill="#f3e9b5"/></svg>`;
}

function countUp(el, from, to) {
  const t0 = performance.now(), dur = 900;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = `${Math.round(from + (to - from) * e)}°`;
    if (k < 1 && el.isConnected) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- motion helpers ---------- */
const N = (v, dec = 0) => `<span class="num" data-to="${v}" data-dec="${dec}">${(+v).toFixed(dec)}</span>`;
function animateNums() {
  $$(".num").forEach((el, i) => {
    const to = +el.dataset.to, dec = +el.dataset.dec, t0 = performance.now() + 300 + i * 60, dur = 1000;
    el.textContent = (0).toFixed(dec);
    const step = (t) => {
      const k = Math.max(0, Math.min(1, (t - t0) / dur)), e = 1 - Math.pow(1 - k, 4);
      el.textContent = (to * e).toFixed(dec);

  });
}
// 3D tilt + light sheen that follows the mouse (mouse only, not touch)
function bindTilt() {
  if (reduceMotion) return;
  const tilt = (el, max, parallax) => {
    el.addEventListener("pointermove", (e) => {
      if (e.pointerType !== "mouse") return;
      const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      el.classList.add("tilting");
      el.style.setProperty("--ry", `${(x - .5) * max}deg`); el.style.setProperty("--rx", `${(.5 - y) * max}deg`);
      el.style.setProperty("--mx", `${x * 100}%`); el.style.setProperty("--my", `${y * 100}%`);
      if (parallax) { el.style.setProperty("--px", `${(x - .5) * 22}px`); el.style.setProperty("--py", `${(y - .5) * 16}px`); }
    });
    el.addEventListener("pointerleave", () => {
      el.classList.remove("tilting");
      ["--rx", "--ry", "--px", "--py"].forEach(p => el.style.removeProperty(p));
    });
  };
  const hero = $(".now"); if (hero) tilt(hero, 7, true);
  $$(".tile").forEach(t => tilt(t, 10, false));
}
// ripple on every button press
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest("button"); if (!b || reduceMotion) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), sp = document.createElement("span");
  sp.className = "ripple";
  Object.assign(sp.style, { width: s + "px", height: s + "px", left: e.clientX - r.left - s / 2 + "px", top: e.clientY - r.top - s / 2 + "px" });
  b.appendChild(sp); setTimeout(() => sp.remove(), 650);
});
// little golden sparks flying out of an element
function sparks(el, n = 14) {
  if (reduceMotion || !el) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#ffd25a", "#ffb03a", "#fff2b0", "#7cc4ff"];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * .4, d = 30 + Math.random() * 40, p = document.createElement("span");
    p.className = "spark";
    Object.assign(p.style, { left: cx - 3.5 + "px", top: cy - 3.5 + "px", background: colors[i % colors.length] });
    p.style.setProperty("--dx", Math.cos(a) * d + "px"); p.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(p); setTimeout(() => p.remove(), 750);
  }
}

// hover / touch readout on the hourly chart
function bindCrosshair(hrs) {
  const svg = $("#hourly svg"), g = svg.querySelector(".hcross"), G = hourlyGeom;
  const show = (e) => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * G.Wd;
    const i = Math.max(0, Math.min(hrs.length - 1, Math.round((vx - G.padX) / G.step)));
    const x = G.padX + i * G.step, y = G.ys[i], hr = hrs[i];
    const label = `${fmt(hr.t, { hour: "numeric" })} · ${Math.round(toU(hr.temp))}° · ${hr.pop}%`;
    const tw = label.length * 7.2 + 18, bx = Math.max(4, Math.min(G.Wd - tw - 4, x - tw / 2));
    g.querySelector("line").setAttribute("x1", x); g.querySelector("line").setAttribute("x2", x);
    g.querySelector("circle").setAttribute("cx", x); g.querySelector("circle").setAttribute("cy", y);
    const rect = g.querySelector("rect"); rect.setAttribute("x", bx); rect.setAttribute("width", tw);
    const t = g.querySelector("text"); t.setAttribute("x", bx + tw / 2); t.textContent = label;
    g.setAttribute("opacity", 1);
  };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => g.setAttribute("opacity", 0));
}
let hourlyGeom = {};

function hourlySvg(hrs, fromNow, animate) {
  const Wd = 1000, H = 230, padX = 24, top = 62, bottom = 132, barTop = 154, barBot = 192;
  const temps = hrs.map(x => toU(x.temp));
  const mn = Math.min(...temps), mx = Math.max(...temps), rng = mx - mn || 1;
  const step = (Wd - padX * 2) / (hrs.length - 1);
  const x = (i) => padX + i * step;
  const y = (v) => bottom - (v - mn) / rng * (bottom - top);
  // smooth curve through the points (Catmull-Rom -> Bezier)
  const P2 = temps.map((v, i) => [x(i), y(v)]);
  let path = `M${P2[0][0]},${P2[0][1]}`;
  for (let i = 0; i < P2.length - 1; i++) {
    const p0 = P2[i - 1] || P2[i], p1 = P2[i], p2 = P2[i + 1], p3 = P2[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    path += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${path}L${x(hrs.length - 1)},${bottom + 8}L${padX},${bottom + 8}Z`;
  const A = animate && !reduceMotion;
  let out = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${S().next24}">
    <defs><linearGradient id="hg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".3"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <line x1="${padX}" x2="${Wd - padX}" y1="${barBot}" y2="${barBot}" stroke="var(--line)"/>
    <path d="${area}" fill="url(#hg)" class="${A ? "draw-area" : ""}"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.8" stroke-linecap="round" pathLength="1" class="${A ? "draw-line" : ""}"/>`;
  if (fromNow) out += `<line class="now-line" x1="${padX}" x2="${padX}" y1="${top - 8}" y2="${barBot}"/>`;
  hrs.forEach((hr, i) => {
    const bh = (barBot - barTop) * hr.pop / 100, delay = `style="animation-delay:${(i * 30)}ms"`;
    if (hr.pop > 0) out += `<rect class="${A ? "grow-bar" : ""}" ${delay} x="${x(i) - 7}" y="${barBot - bh}" width="14" height="${bh}" rx="3" fill="var(--cool)" opacity=".75"/>`;
    if (i % 2 === 0) {
      const [, k] = wmo(hr.code);
      out += `<g class="${A ? "fade-in" : ""}" ${delay}><g transform="translate(${x(i) - 14} 4) scale(.44)">${icon(k, !hr.day).replace(/<\/?svg[^>]*>/g, "")}</g>`;
      out += `<text class="t" x="${x(i)}" y="${y(temps[i]) - 11}" text-anchor="middle">${Math.round(temps[i])}°</text>`;
      out += `<text x="${x(i)}" y="${H - 14}" text-anchor="middle">${i === 0 && fromNow ? S().now : fmt(hr.t, { hour: "numeric" })}</text>`;
      if (hr.pop >= 10) out += `<text class="p" x="${x(i)}" y="${barBot - bh - 4}" text-anchor="middle">${hr.pop}%</text>`;
      out += `</g>`;
    }
    const first = i === 0 && fromNow;
    out += `<circle class="${A ? "fade-in" : ""}" ${delay} cx="${x(i)}" cy="${y(temps[i])}" r="${first ? 5.5 : 2.6}" fill="${first ? "var(--accent)" : "var(--panel)"}" stroke="var(--accent)" stroke-width="2"/>`;
  });
  if (fromNow && !reduceMotion) out += `<circle cx="${x(0)}" cy="${y(temps[0])}" r="6" fill="none" stroke="var(--accent)" stroke-width="2"><animate attributeName="r" values="6;16" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="1.6s" repeatCount="indefinite"/></circle>`;
  hourlyGeom = { Wd, padX, step, ys: temps.map(y) };
  out += `<g class="hcross" opacity="0"><line y1="${top - 14}" y2="${barBot}"/><circle r="6"/><rect y="${top - 46}" height="24" rx="8"/><text y="${top - 29}" text-anchor="middle"></text></g>`;
  return out + "</svg>";
}

let timer, results = [], sel = -1;
$("#q").addEventListener("input", (e) => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (q.length < 2) return hideSuggest();
  timer = setTimeout(async () => {
    try {
      const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?" + new URLSearchParams({ name: q, count: 6, language: lang }));
      results = (await r.json()).results || [];
      sel = -1; showSuggest();
    } catch { hideSuggest(); }
  }, 250);
});
$("#q").addEventListener("keydown", (e) => {
  if ($("#suggest").hidden) return;
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, results.length - 1); showSuggest(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); showSuggest(); e.preventDefault(); }
  else if (e.key === "Enter") { pick(results[Math.max(sel, 0)]); e.preventDefault(); }
  else if (e.key === "Escape") hideSuggest();
});

  }
}
function applyTheme() {

  const s = S(), label = { auto: s.themeAuto, light: s.themeLight, dark: s.themeDark }[theme];
  $("#theme").innerHTML = I[theme];
  $("#theme").title = label; $("#theme").setAttribute("aria-label", label);
}

/* drag-to-scroll the hourly chart with a mouse */
(() => {
  let down = false, sx = 0, sl = 0, el = null;
  document.addEventListener("pointerdown", (e) => {
    el = e.target.closest(".hourly"); if (!el || e.pointerType !== "mouse") return;
    down = true; sx = e.clientX; sl = el.scrollLeft; el.classList.add("dragging");
  });
  document.addEventListener("pointermove", (e) => { if (down) el.scrollLeft = sl - (e.clientX - sx); });
  document.addEventListener("pointerup", () => { if (down) { down = false; el.classList.remove("dragging"); } });
})();

/* ================= geolocation ================= */
$("#locate").onclick = () => {
  const s = S();
  if (!navigator.geolocation) return toast(s.locNA);
  toast(s.locFind);
  navigator.geolocation.getCurrentPosition(async (p) => {
    const { latitude: lat, longitude: lon } = p.coords;
    let name = S().myPlace, admin = "", country = "";
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=${lang}&lat=${lat}&lon=${lon}`);
      const a = (await r.json()).address || {};
      name = a.city || a.town || a.village || a.county || name; admin = a.state || ""; country = a.country || "";
    } catch {}
    go({ name, admin, country, lat, lon });
  }, () => toast(S().locBlock), { timeout: 10000 });
};

/* ================= toast ================= */
let toastTimer;
function toast(msg) {
  $(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.setAttribute("role", "status"); el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ================= keep fresh ================= */
setInterval(() => { if (!document.hidden) load(); }, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - fetchedAt > 10 * 60 * 1000) load(); });
let lastW = innerWidth;
addEventListener("resize", () => {
  clearTimeout(window._rz);
  window._rz = setTimeout(() => {
    placeThumb($(".seg-lang")); placeThumb($(".seg-unit"));
    if (data && (lastW > 560) !== (innerWidth > 560)) render(false);
    lastW = innerWidth;
  }, 200);
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
